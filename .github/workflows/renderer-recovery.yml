name: Renderer recovery
on:
  push:
    branches: [dev/renderer-recovery-20260918]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renderer-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve the exact source under test
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-evidence/source-commit.txt"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/recovery-evidence/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-source-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Obtain the pinned official public server API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vintagestory"
          curl --fail --location --retry 2 --max-time 180 \
            'https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.7.tar.gz' \
            -o "$RUNNER_TEMP/vs-server.tar.gz"
          sha256sum "$RUNNER_TEMP/vs-server.tar.gz" | tee "$RUNNER_TEMP/recovery-evidence/server-package.sha256"
          tar -xzf "$RUNNER_TEMP/vs-server.tar.gz" -C "$RUNNER_TEMP/vintagestory"
          api_dll=$(find "$RUNNER_TEMP/vintagestory" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/vintagestory" -name '*.dll' -printf '%P\n' | sort
      - name: Compile against real Vintage Story references
        shell: bash
        run: |
          set -o pipefail
          dotnet build VintageRTX.sln -c Release 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/build.log"
      - name: Archive build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/recovery-evidence/build.log
            ${{ runner.temp }}/recovery-evidence/server-package.sha256
          if-no-files-found: warn
          retention-days: 14
