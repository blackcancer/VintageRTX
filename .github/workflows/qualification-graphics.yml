name: Offline graphics test dependencies
on:
  push:
    branches: ['dev/renderer-rewrite-20260921']
    paths: ['.github/workflows/qualification-graphics.yml']
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Acquire distro GLFW and record its provenance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglfw3
          mkdir -p artifacts
          cp -L /usr/lib/x86_64-linux-gnu/libglfw.so.3 artifacts/libglfw.so
          dpkg-query -W libglfw3 > artifacts/package-version.txt
          ldd artifacts/libglfw.so > artifacts/dependencies.txt
          sha256sum artifacts/libglfw.so > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rewrite-offline-glfw-${{ github.sha }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: error
