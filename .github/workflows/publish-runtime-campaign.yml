name: Publish verified runtime campaign corrections
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['.github/workflows/publish-runtime-campaign.yml', 'tools/recovery/campaign-staging/**']
permissions:
  contents: write
concurrency:
  group: publish-runtime-campaign
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact source base and apply the reviewed readable delta
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/campaign-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/campaign-evidence/staging-commit.txt"
          python3 - <<'PY'
          import hashlib, pathlib, shutil, subprocess
          base = {
            'src/VintageRTX/Rendering/FrameCaptureService.cs': '193fc31fbd7d634c42d3e605b54608aa1b93cdbbf3155616312f12254328b80e',
            'src/VintageRTX/Rendering/FilmicDisplayRenderer.cs': '18ebe45e15af66983bdd6b8fe3e986c3fb777b754e5df5439d11eca76c511fa4',
            'tests/VintageRTX.Test/RuntimeDataSandbox.cs': '16205fe7227c7739311a8bd6e9b6b2e334c79492c34570c8b28b3d96baa340fb',
            'tests/VintageRTX.Test/RuntimeHarness.cs': '8ed99b20b1ded5d8b60c62a6617e899185a90913a8ceb5d6c0c9fdff97df24bf',
            'tests/VintageRTX.Test/InGameRealCaseTests.cs': '54b9360f4398aea9a32823a62f6546c356a64c91064f674462ea7c76a5cd3fcd',
            'tests/VintageRTX.Test/RendererServicesCoverageTests.cs': 'afe77ae7a6d891bb895a7f38055473130761a6e232fad23e94e858a7db653144',
            'tests/VintageRTX.Test/CoverageRenderingServicesResidualTests.cs': 'bfa2ca171baa810db1261373ff49b5f12008932683cb0aa2945b1109d6092dff'
          }
          for path, expected in base.items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Unexpected source revision: ' + path)
          subprocess.run(['git','apply','--check','tools/recovery/campaign-staging/change.patch'],check=True)
          subprocess.run(['git','apply','tools/recovery/campaign-staging/change.patch'],check=True)
          targets = {
            'FrameCaptureDiagnosticContract.cs': 'src/VintageRTX/Rendering',
            'RuntimeScenarioCompletion.cs': 'tests/VintageRTX.Test',
            'RuntimeScenarioResult.cs': 'tests/VintageRTX.Test',
            'RuntimeCampaignContractTests.cs': 'tests/VintageRTX.Test'
          }
          for name, folder in targets.items():
              target = pathlib.Path(folder)/name
              if target.exists(): raise SystemExit('Refusing to overwrite new file: '+str(target))
              shutil.copyfile(pathlib.Path('tools/recovery/campaign-staging')/(name+'.txt'),target)
          # Never capture a fallback final picture as if the requested G-buffer diagnostic ran.
          p = pathlib.Path('src/VintageRTX/Rendering/FilmicDisplayRenderer.cs')
          text=p.read_text()
          old='if (captureFrame\n                && FrameCaptureDiagnosticContract.RequiresRaw(activeCaptureStep.Request.DebugViewOverride))'
          assert text.count(old)==1
          p.write_text(text.replace(old,'if (captureFrame && gBufferAvailable\n                && FrameCaptureDiagnosticContract.RequiresRaw(activeCaptureStep.Request.DebugViewOverride))'))
          PY
          git diff --check
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare official client references and a hidden OpenGL display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/campaign-evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile ordinary patched sources and the real test project
        run: |
          set -euo pipefail
          dotnet restore tests/VintageRTX.Test/VintageRTX.Test.csproj --source https://api.nuget.org/v3/index.json
          dotnet build tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/campaign-evidence/build.log"
      - name: Execute existing reported classes
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/reported-regressions.runsettings --logger 'trx;LogFileName=reported.trx' --results-directory "$RUNNER_TEMP/campaign-evidence" 2>&1 | tee "$RUNNER_TEMP/campaign-evidence/reported.log"
      - name: Execute complete capture, sandbox, result and completion classes
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~RuntimeCampaignContractTests|FullyQualifiedName~RendererServicesCoverageTests|FullyQualifiedName~CoverageRenderingServicesResidualTests|FullyQualifiedName~RuntimeDataSandboxTests|FullyQualifiedName~RuntimeHarnessLogMergeTests|FullyQualifiedName~RawAlbedoTargetTests' --logger 'trx;LogFileName=campaign.trx' --results-directory "$RUNNER_TEMP/campaign-evidence" 2>&1 | tee "$RUNNER_TEMP/campaign-evidence/campaign.log"
      - name: Reject skipped campaigns and publish only tested sources without overwriting concurrent work
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, os, xml.etree.ElementTree as E, hashlib, json
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'campaign-evidence'
          for name, minimum in [('reported',103),('campaign',5)]:
              root=E.parse(folder/(name+'.trx')).getroot()
              results=[n for n in root.iter() if n.tag.endswith('UnitTestResult')]
              if len(results)<minimum or any(n.get('outcome')!='Passed' for n in results): raise SystemExit('Incomplete/failed campaign: '+name)
              if name=='campaign' and len([n for n in results if n.get('testName') in {'DiagnosticChannelsRetainZeroAndRgbWithoutFinalContamination','MissingAndWrongSizeRawFramesRestartWithoutSaving','FinishedEvidenceDoesNotWaitForSuccessTokens','CompletionRequiresCorrectProfileAndIndependentEvents','ReportsKeepExactFailuresAndInputIdentity'}])!=5: raise SystemExit('The five new regression tests did not execute')
              print(name,len(results),'executed and passed')
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for base in ['src/VintageRTX','tests/VintageRTX.Test'] for p in pathlib.Path(base).rglob('*.cs') if '/obj/' not in str(p) and '/bin/' not in str(p)}
          (folder/'tested-source-sha256.json').write_text(json.dumps(files,indent=2))
          PY
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/Rendering/FrameCaptureService.cs src/VintageRTX/Rendering/FilmicDisplayRenderer.cs src/VintageRTX/Rendering/FrameCaptureDiagnosticContract.cs tests/VintageRTX.Test/RuntimeDataSandbox.cs tests/VintageRTX.Test/RuntimeHarness.cs tests/VintageRTX.Test/InGameRealCaseTests.cs tests/VintageRTX.Test/RendererServicesCoverageTests.cs tests/VintageRTX.Test/CoverageRenderingServicesResidualTests.cs tests/VintageRTX.Test/RuntimeScenarioCompletion.cs tests/VintageRTX.Test/RuntimeScenarioResult.cs tests/VintageRTX.Test/RuntimeCampaignContractTests.cs
          git rm -r tools/recovery/campaign-staging .github/workflows/publish-runtime-campaign.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate numeric capture channels and separate runtime completion from acceptance'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/campaign-evidence/published-commit.txt"
      - name: Preserve text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-campaign-${{ github.sha }}
          path: ${{ runner.temp }}/campaign-evidence/
          if-no-files-found: error
          retention-days: 14
