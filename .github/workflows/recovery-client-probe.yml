name: Recovery client startup probe
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['.github/workflows/recovery-client-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Install headless display prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libopenal1 libgl1-mesa-dri libglfw3 imagemagick libgtk-3-0t64
      - name: Run the unmodified official client with documented startup arguments
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p client client-evidence isolated-data
          curl -fL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o client.tar.gz
          sha256sum client.tar.gz > client-evidence/client-package.sha256
          tar -xzf client.tar.gz -C client
          root=$(dirname "$(find client -name Vintagestory.dll -print -quit)")
          test -f "$root/Vintagestory.dll"
          root=$(realpath "$root")
          export CLIENT_ROOT="$root" EVIDENCE_ROOT="$RUNNER_TEMP/client-evidence" DATA_ROOT="$RUNNER_TEMP/isolated-data"
          export LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$root/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a bash -c 'cd "$CLIENT_ROOT"; timeout 20 dotnet Vintagestory.dll --help > "$EVIDENCE_ROOT/help.txt" 2>&1' || true
          xvfb-run -a -s '-screen 0 800x600x24' bash -c '
            cd "$CLIENT_ROOT"
            timeout 100 dotnet Vintagestory.dll --dataPath "$DATA_ROOT" --logPath "$EVIDENCE_ROOT/logs" --openWorld recovery-client-probe -p preset-surviveandbuild > "$EVIDENCE_ROOT/stdout.txt" 2>&1 &
            pid=$!
            sleep 35
            import -window root "$EVIDENCE_ROOT/startup-35s.png" || true
            sleep 35
            import -window root "$EVIDENCE_ROOT/startup-70s.png" || true
            wait "$pid"; code=$?
            echo "$code" > "$EVIDENCE_ROOT/exit-code.txt"
            exit 0
          '
          find "$DATA_ROOT" -maxdepth 2 -type f -name '*.log' -exec cp '{}' client-evidence/ \;
          # No client binaries, assets, fonts, settings, credentials or save files are published.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-client-startup-evidence
          path: ${{ runner.temp }}/client-evidence/
          if-no-files-found: error
          retention-days: 3
