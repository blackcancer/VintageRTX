name: Verify and publish exact performance round one
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/performance/**', '.github/workflows/publish-perf-round1.yml']
permissions:
  contents: write
concurrency:
  group: vintagertx-perf-round1-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: true
      - name: Verify base and apply ordinary source changes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/perf-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/perf-evidence/staging-commit.txt"
          python3 tools/performance/staging/apply.py
          git diff --check
          git diff --stat > "$RUNNER_TEMP/perf-evidence/changes.txt"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare actual client references and OpenGL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/perf-evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
          lscpu > "$RUNNER_TEMP/perf-evidence/cpu.txt"
          python3 -m venv "$RUNNER_TEMP/glsl-tests"
          "$RUNNER_TEMP/glsl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
      - name: Compile actual mod and test projects
        run: |
          set -euo pipefail
          dotnet --info > "$RUNNER_TEMP/perf-evidence/dotnet.txt"
          for project in tests/VintageRTX.Test/VintageRTX.Test.csproj tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj; do
            dotnet restore "$project" --source https://api.nuget.org/v3/index.json
            dotnet build "$project" -c Release --no-restore
          done 2>&1 | tee "$RUNNER_TEMP/perf-evidence/build.log"
      - name: Compare exact historical solver and measure both CPU implementations
        run: |
          set -euo pipefail
          dotnet build-server shutdown
          python3 tools/performance/compare_liquid.py --output-directory "$RUNNER_TEMP/perf-evidence" 2>&1 | tee "$RUNNER_TEMP/perf-evidence/liquid-comparison.log"
      - name: Verify reconstruction output and zero-weight work on OpenGL
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/glsl-tests/bin/python" tools/performance/verify_reconstruction.py --baseline "$RUNNER_TEMP/perf-evidence/baseline-display.frag" --report "$RUNNER_TEMP/perf-evidence/reconstruction.json"
      - name: Execute both shared selections and all liquid classes
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          for selection in blocker-smoke reported-regressions; do
            xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings "tests/$selection.runsettings" --logger "trx;LogFileName=$selection.trx" --results-directory "$RUNNER_TEMP/perf-evidence" 2>&1 | tee "$RUNNER_TEMP/perf-evidence/$selection.log"
          done
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~Liquid' --logger 'trx;LogFileName=liquids.trx' --results-directory "$RUNNER_TEMP/perf-evidence" 2>&1 | tee "$RUNNER_TEMP/perf-evidence/liquids.log"
      - name: Execute GLSL regressions and cold-cache multipass RenderLab
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          for suite in recovery feedback materials transport; do
            "$RUNNER_TEMP/glsl-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/perf-evidence/glsl-$suite.log"
          done
          export MESA_SHADER_CACHE_DIR="$RUNNER_TEMP/perf-renderlab-cold"
          mkdir -p "$MESA_SHADER_CACHE_DIR"
          timeout 180s xvfb-run -a dotnet test tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProductionShaderCompilesAndRendersHeadlessly' --logger 'trx;LogFileName=renderlab.trx' --results-directory "$RUNNER_TEMP/perf-evidence" 2>&1 | tee "$RUNNER_TEMP/perf-evidence/renderlab.log"
      - name: Reject incomplete results and publish tested ordinary sources without force
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,xml.etree.ElementTree as ET,json
          p=Path(os.environ['RUNNER_TEMP'])/'perf-evidence'
          for name,minimum in [('blocker-smoke',35),('reported-regressions',155),('liquids',5),('renderlab',1)]:
              root=ET.parse(p/(name+'.trx')).getroot();c=root.find('.//{*}Counters')
              assert c is not None and int(c.get('total','0'))>=minimum
              assert c.get('total')==c.get('passed')==c.get('executed'),(name,c.attrib)
          assert json.loads((p/'liquid-performance.json').read_text())['bitwiseIdentical']
          assert len(json.loads((p/'reconstruction.json').read_text())['cases'])==12
          PY
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/Rendering/LiquidSurfaceSimulation.cs src/VintageRTX/Rendering/LiquidSurfaceTopology.cs src/VintageRTX/assets/vintagertx/shaders/display.frag tests/VintageRTX.Test/LiquidSurfaceTopologyTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: cache liquid topology and skip exact zero-weight reconstruction taps'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/perf-evidence/published-commit.txt"
      - name: Retain exact evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-round1-${{ github.sha }}
          path: ${{ runner.temp }}/perf-evidence/
          if-no-files-found: error
          retention-days: 30
