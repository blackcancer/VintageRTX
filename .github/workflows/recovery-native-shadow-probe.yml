name: Native solar contract probe
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['.github/workflows/recovery-native-shadow-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Inspect official receiver-space declarations and matrix producers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solar-contract" "$RUNNER_TEMP/client" "$RUNNER_TEMP/probe"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/solar-contract/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/client"
          root=$(dirname "$(find "$RUNNER_TEMP/client" -name VintagestoryAPI.dll -print -quit)")
          export VINTAGE_STORY="$root"
          export CECIL_PATH="$(find "$root" -name Mono.Cecil.dll -print -quit)"
          test -n "$CECIL_PATH"
          python3 - <<'PY'
          import pathlib, os, re
          root=pathlib.Path(os.environ['VINTAGE_STORY'])/'assets/game'
          lines=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in ['.vsh','.fsh','.ash']:continue
              text=p.read_text(encoding='utf-8-sig')
              if not re.search(r'(toShadowMapSpace|shadowMapFar|shadowMapNear|calcShadowMapCoords)',text,re.I):continue
              rows=text.splitlines(); indices=set()
              for i,row in enumerate(rows):
                  if re.search(r'(toShadowMapSpace|shadowMap|shadowCoords|worldPos|modelView|modelMatrix|gl_Position|length\()',row,re.I):
                      indices.update(range(max(0,i-3),min(len(rows),i+5)))
              lines.append('\nFILE '+str(p.relative_to(root)))
              lines.extend(f'{i+1}: {rows[i]}' for i in sorted(indices))
          output='\n'.join(lines); print(output)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'solar-contract/shader-contract.txt').write_text(output)
          PY
          cd "$RUNNER_TEMP/probe"
          cat > probe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="Mono.Cecil"><HintPath>$(CECIL_PATH)</HintPath></Reference></ItemGroup></Project>
          XML
          cat > Program.cs <<'CS'
          using Mono.Cecil;
          var root=Environment.GetEnvironmentVariable("VINTAGE_STORY")!;
          var output=new List<string>();
          IEnumerable<TypeDefinition> Types(TypeDefinition t) { yield return t; foreach(var n in t.NestedTypes) foreach(var c in Types(n)) yield return c; }
          foreach(var p in Directory.GetFiles(root,"Vintagestory*.dll")) {
            using var module=ModuleDefinition.ReadModule(p);
            foreach(var t in module.Types.SelectMany(Types)) foreach(var m in t.Methods) {
              if(!m.HasBody) continue;
              var il=m.Body.Instructions;
              var selected=new SortedSet<int>();
              for(int i=0;i<il.Count;i++) {
                var name=il[i].Operand?.ToString()??"";
                if(!name.Contains("ToShadowMapSpaceMatrix") && !(name.Contains("playerReferencePos") && (m.Name.Contains("Shadow")||t.Name.Contains("Shadow")))) continue;
                if(m.Name=="PrepareDefaultShader"||t.Name.StartsWith("ShaderProgram"))continue;
                for(int j=Math.Max(0,i-45);j<Math.Min(il.Count,i+25);j++)selected.Add(j);
              }
              if(selected.Count==0)continue;
              output.Add("\nMETHOD "+Path.GetFileName(p)+" "+m.FullName);
              output.AddRange(selected.Select(i=>il[i].ToString()));
            }
          }
          File.WriteAllLines(Path.Combine(Environment.GetEnvironmentVariable("RUNNER_TEMP")!,"solar-contract/matrix-producers.txt"),output);
          Console.WriteLine($"Matrix producer evidence: {output.Count} instructions/headers.");
          CS
          dotnet run --project probe.csproj -c Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-solar-contract
          path: ${{ runner.temp }}/solar-contract/
          retention-days: 3
          if-no-files-found: error
