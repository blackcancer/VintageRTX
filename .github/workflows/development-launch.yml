name: Development mod deployment and launch contract
on:
  push:
    branches: ['dev/renderer-rewrite-20260921']
  pull_request:
    branches: ['dev/renderer-rewrite-20260921']
permissions:
  contents: read
concurrency:
  group: development-launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment:
    name: Debug and Release deployment (${{ matrix.os }}, no game world)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          dotnet-version: '10.0.401'
      - name: Obtain official managed client references (1.22.7)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vs" artifacts/development-layout
          curl -fL --retry 2 --max-time 180 https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz -o "$RUNNER_TEMP/client.tar.gz"
          python - <<'PY'
          import hashlib, os, shutil, tarfile
          from pathlib import Path, PurePosixPath
          temporary = Path(os.environ['RUNNER_TEMP'])
          archive = temporary/'client.tar.gz'
          with archive.open('rb') as stream:
              checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
          Path('artifacts/development-layout/client.sha256').write_text(checksum+'\n')
          # These are managed assembly/layout tests, not a Linux game launch on Windows.
          # Read paths through Python rather than treating a Windows drive colon as tar's remote host syntax.
          destination = (temporary/'vs').resolve()
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle:
                  if not member.isfile() or not member.name.lower().endswith('.dll'):
                      continue
                  relative = PurePosixPath(member.name)
                  assert not relative.is_absolute() and '..' not in relative.parts, member.name
                  target = destination.joinpath(*relative.parts).resolve()
                  assert target.is_relative_to(destination), member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.extractfile(member) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output)
          dlls = list(destination.rglob('VintagestoryAPI.dll'))
          assert len(dlls) == 1, dlls
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('VINTAGE_STORY=' + str(dlls[0].parent.resolve()) + '\n')
          PY
      - name: Verify evaluated paths, packages and restored debugger profiles
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_development_layout.py
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: always()
        with:
          name: development-launch-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/development-layout/
          if-no-files-found: error
