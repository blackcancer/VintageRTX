name: Reproducible rewrite qualification toolchain
on:
  push:
    branches: ['dev/renderer-rewrite-20260921']
    paths: ['.github/workflows/qualification-toolchain.yml']
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Restore exact project packages and acquire official reference files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vs" artifacts
          curl -fL --retry 2 --max-time 180 https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > artifacts/client.sha256
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs"
          dll=$(find "$RUNNER_TEMP/vs" -name VintagestoryAPI.dll -print -quit)
          test -n "$dll"
          export VINTAGE_STORY="$(dirname "$dll")"
          dotnet restore tests/VintageRTX.Core.Tests/VintageRTX.Core.Tests.csproj
          dotnet restore tests/VintageRTX.Client.Tests/VintageRTX.Client.Tests.csproj
          stage="$RUNNER_TEMP/offline"
          mkdir -p "$stage/sdk" "$stage/packages" "$stage/game"
          cp -a "$DOTNET_ROOT"/. "$stage/sdk/"
          cp -a "$HOME/.nuget/packages"/. "$stage/packages/"
          cd "$VINTAGE_STORY"
          find . -type f \( -iname '*.dll' -o -iname '*.runtimeconfig.json' -o -iname '*.deps.json' -o -path './assets/*/shaders/*' -o -path './assets/*/shaderincludes/*' -o -path './assets/*/blocktypes/*' -o -path './assets/*/itemtypes/*' \) -print0 | tar --null -T - -cf - | tar -xf - -C "$stage/game"
          cd "$GITHUB_WORKSPACE"
          git rev-parse HEAD > artifacts/commit.txt
          dotnet --info > artifacts/dotnet.txt
          tar -czf artifacts/offline-toolchain.tar.gz -C "$stage" sdk packages game
          sha256sum artifacts/offline-toolchain.tar.gz > artifacts/offline-toolchain.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rewrite-offline-toolchain-${{ github.sha }}
          path: artifacts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
