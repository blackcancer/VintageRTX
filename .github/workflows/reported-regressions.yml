name: Reported renderer regressions
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['.github/workflows/reported-regressions.yml', 'src/**', 'tests/**', 'tools/VintageRTX.RenderLab/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reported-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    name: Reported classes and synthetic RenderLab (not in-game acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare official API references and hidden OpenGL context
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/vs-client"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1 > "$RUNNER_TEMP/evidence/packages.log"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile both real test projects
        run: |
          set -euo pipefail
          for project in tests/VintageRTX.Test/VintageRTX.Test.csproj tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj; do
            dotnet restore "$project" --source https://api.nuget.org/v3/index.json
            dotnet build "$project" -c Release --no-restore
          done
      - name: Execute complete reported classes with the shared local filter
        id: unit
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          code=0
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/reported-regressions.runsettings --logger 'trx;LogFileName=reported.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/reported.log" 2>&1 || code=$?
          echo "Reported class process exit code: $code"
          exit "$code"
      - name: Execute unchanged RenderLab production acceptance
        id: lab
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          code=0
          timeout 180s xvfb-run -a dotnet test tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~ProductionShaderCompilesAndRendersHeadlessly --logger 'trx;LogFileName=renderlab.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/renderlab.log" 2>&1 || code=$?
          echo "RenderLab process exit code: $code"
          exit "$code"
      - name: Summarize without dumping complete shaders
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as E
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          for path in folder.glob('*.trx'):
              root=E.parse(path).getroot()
              print('\nREPORT',path.name)
              for n in root.iter():
                  if n.tag.endswith('Counters'): print('COUNTERS',n.attrib)
                  if n.tag.endswith('UnitTestResult') and n.get('outcome')!='Passed':
                      print('\nFAILURE',n.get('testName'),n.get('outcome'))
                      for part in n.iter():
                          if part.tag.endswith(('Message','StackTrace')) and part.text:
                              text=part.text
                              print(text if len(text)<4500 else text[:300]+'\n[shader omitted]\n'+text[-1500:])
          for path in folder.glob('*.log'):
              print('\nLOG TAIL',path.name)
              for line in path.read_text(errors='replace').splitlines()[-12:]:
                  print(line if len(line)<1500 else line[:100]+' ... '+line[-700:])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reported-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Require successful execution and reject empty or skipped campaigns
        if: always()
        run: |
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.lab.outcome }}' = success
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as E
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          for name,minimum in [('reported',98),('renderlab',1)]:
              root=E.parse(folder/(name+'.trx')).getroot()
              results=[n for n in root.iter() if n.tag.endswith('UnitTestResult')]
              if len(results)<minimum or any(n.get('outcome')!='Passed' for n in results):
                  raise SystemExit(f'{name}: required campaign missing, failed or skipped')
              print(f'{name}: {len(results)} tests executed and passed.')
              if name=='renderlab' and (len(results)!=1 or results[0].get('testName')!='ProductionShaderCompilesAndRendersHeadlessly'):
                  raise SystemExit('The requested RenderLab test was not executed.')
          PY
