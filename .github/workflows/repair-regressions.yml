name: Validate reported regression repairs
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/recovery/*reported_regressions.py', 'tests/materials/test_reported_materials.py', '.github/workflows/repair-regressions.yml']
permissions:
  contents: write
concurrency:
  group: reported-regression-repair-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply exact repairs to the reproduced baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/staging-commit.txt"
          python3 tools/recovery/finish_reported_regressions.py | tee "$RUNNER_TEMP/evidence/repairs.log"
          git diff --check
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare official client references and software OpenGL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1 > "$RUNNER_TEMP/evidence/packages.log"
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile both real projects
        run: |
          set -euo pipefail
          for project in tests/VintageRTX.Test/VintageRTX.Test.csproj tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj; do
            dotnet restore "$project" --source https://api.nuget.org/v3/index.json
            dotnet build "$project" -c Release --no-restore
          done
      - name: Execute complete reported classes
        id: unit
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          filter='FullyQualifiedName~CoverageFilmicResidualTests|FullyQualifiedName~DisplayShaderAssetTests|FullyQualifiedName~FilmicDisplayRendererLogicCoverageTests|FullyQualifiedName~LiquidShaderPhysicsTests|FullyQualifiedName~PbrEntityRendererTests|FullyQualifiedName~ShadowFilterPipelineTests|FullyQualifiedName~VoxelSceneCoverageDeepTests'
          code=0
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter "$filter" --logger 'trx;LogFileName=reported.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/reported.log" 2>&1 || code=$?
          echo "Reported classes exit code: $code"
          exit "$code"
      - name: Execute unchanged RenderLab acceptance
        id: lab
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          code=0
          timeout 180s xvfb-run -a dotnet test tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~ProductionShaderCompilesAndRendersHeadlessly --logger 'trx;LogFileName=renderlab.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/renderlab.log" 2>&1 || code=$?
          echo "RenderLab exit code: $code"
          exit "$code"
      - name: Execute prior blocker campaign and actual MRT
        id: smoke
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/blocker-smoke.runsettings --logger 'trx;LogFileName=blocker-smoke.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/blocker-smoke.log" 2>&1
          python3 tools/recovery/check_blocker_smoke.py "$RUNNER_TEMP/evidence/blocker-smoke.trx"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RawAlbedoTargetTests --logger 'trx;LogFileName=raw-albedo.trx' --results-directory "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/raw-albedo.log" 2>&1
      - name: Execute production GLSL numerical suites
        id: glsl
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gl-tests"
          "$RUNNER_TEMP/gl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          for suite in recovery feedback materials transport; do
            "$RUNNER_TEMP/gl-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/evidence/$suite.log"
          done
      - name: Summarize exact outcomes without complete shader dumps
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as E
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          for path in folder.glob('*.trx'):
              root=E.parse(path).getroot()
              print('\nREPORT',path.name)
              for n in root.iter():
                  if n.tag.endswith('Counters'): print('COUNTERS',n.attrib)
                  if n.tag.endswith('UnitTestResult') and n.get('outcome')!='Passed':
                      print('\nFAILURE',n.get('testName'),n.get('outcome'))
                      for part in n.iter():
                          if part.tag.endswith(('Message','StackTrace')) and part.text:
                              text=part.text
                              print(text if len(text)<4500 else text[:150]+'\n[shader omitted]\n'+text[-900:])
          for path in folder.glob('*.log'):
              print('\nLOG',path.name)
              for line in path.read_text(errors='replace').splitlines()[-10:]:
                  print(line if len(line)<1500 else line[:100]+' ... '+line[-700:])
          PY
      - name: Require actual successful execution
        run: |
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.lab.outcome }}' = success
          test '${{ steps.smoke.outcome }}' = success
          test '${{ steps.glsl.outcome }}' = success
          python3 - <<'PY'
          import os,pathlib,xml.etree.ElementTree as E
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          for name,minimum in [('reported',98),('renderlab',1),('blocker-smoke',35),('raw-albedo',1)]:
              results=[n for n in E.parse(folder/(name+'.trx')).iter() if n.tag.endswith('UnitTestResult')]
              assert len(results)>=minimum and all(n.get('outcome')=='Passed' for n in results),name
          PY
      - name: Publish ordinary validated sources with a fast-forward guard
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/Rendering/EntityLightCollector.cs tests/VintageRTX.Test/CoverageFilmicResidualTests.cs tests/VintageRTX.Test/DisplayShaderAssetTests.cs tests/VintageRTX.Test/PbrEntityRendererTests.cs tests/VintageRTX.Test/LiquidShaderPhysicsTests.cs tests/VintageRTX.Test/ShadowFilterPipelineTests.cs tests/VintageRTX.Test/VoxelSceneCoverageDeepTests.cs tests/VintageRTX.Test/FilmicDisplayRendererLogicCoverageTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: guard partial entity worlds and qualify the full reported regression classes'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reported-repair-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
