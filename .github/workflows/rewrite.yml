name: Renderer rewrite foundations
on:
  push:
    branches: ['dev/renderer-rewrite-20260921']
  pull_request:
    branches: ['dev/renderer-rewrite-20260921']
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core, emission assets and production GPU queries (not in-game acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      VINTAGERTX_GPU_CASES: '${{ github.workspace }}/artifacts/scene-gpu-cases.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          dotnet-version: '10.0.401'
      - name: Test all core sources and export exact production packets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rm -f "$VINTAGERTX_GPU_CASES"
          git rev-parse HEAD > artifacts/commit.txt
          dotnet --info > artifacts/dotnet.txt
          dotnet test tests/VintageRTX.Core.Tests/VintageRTX.Core.Tests.csproj -c Release --logger 'trx;LogFileName=core.trx' --results-directory artifacts 2>&1 | tee artifacts/core.log
          python3 - <<'PY'
          import hashlib, json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('artifacts/core.trx').getroot()
          c=r.find('.//{*}Counters')
          assert c is not None and int(c.get('total','0'))>=164,c.attrib if c is not None else 'missing'
          assert c.get('total')==c.get('executed')==c.get('passed'),c.attrib
          methods=r.findall('.//{*}TestMethod')
          for name in ('EmissionCatalogTests','EmissionMultiplicityTests','DirectImageReferenceTests'):
              assert any(name in t.get('className','') for t in methods),name
          assert len(list(Path('src').rglob('*ModSystem.cs')))==1
          assert not Path('src/VintageRTX').exists()
          p=Path(os.environ['VINTAGERTX_GPU_CASES'])
          assert p.is_absolute() and p.is_file(), f'Production packet was not exported: {p}'
          data=p.read_bytes()
          assert len(json.loads(data))==6, 'Incomplete production GPU cases'
          Path('artifacts/scene-packets.sha256').write_text(hashlib.sha256(data).hexdigest()+'\n')
          print(c.attrib)
          PY
      - name: Execute GLSL on the CSharp-produced scene layout
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri
          python3 -m venv "$RUNNER_TEMP/gl-tests"
          "$RUNNER_TEMP/gl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          "$RUNNER_TEMP/gl-tests/bin/pip" freeze > artifacts/python-packages.txt
          "$RUNNER_TEMP/gl-tests/bin/python" -m unittest discover -s tests/gpu-rewrite -v 2>&1 | tee artifacts/gpu.log
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: always()
        with:
          name: rewrite-core-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  adapter:
    name: Native patches, mesh importer and OpenGL uploader (Vintage Story 1.22.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: core
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      VINTAGERTX_DIRECT_EVIDENCE: '${{ github.workspace }}/artifacts/direct-image'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          dotnet-version: '10.0.401'
      - name: Obtain official references and hidden GL context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vs" artifacts
          git rev-parse HEAD > artifacts/commit.txt
          dotnet --info > artifacts/dotnet.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libglfw3 libgl1-mesa-dri libegl1-mesa-dev
          curl -fL --retry 2 --max-time 180 https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > artifacts/client.sha256
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs"
          dll=$(find "$RUNNER_TEMP/vs" -name VintagestoryAPI.dll -print -quit)
          test -n "$dll"
          echo "VINTAGE_STORY=$(dirname "$dll")" >> "$GITHUB_ENV"
      - name: Compile and exercise client assets, native patcher, importer and uploader
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Client.Tests/VintageRTX.Client.Tests.csproj -c Release --logger 'trx;LogFileName=client.trx' --results-directory artifacts 2>&1 | tee artifacts/adapter.log
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('artifacts/client.trx').getroot()
          c=r.find('.//{*}Counters')
          assert c is not None and int(c.get('total','0'))>=25
          assert c.get('total')==c.get('executed')==c.get('passed'),c.attrib
          methods=r.findall('.//{*}TestMethod')
          for name in ('EmissionAssetTests','CandleRuntimeCountTests','DirectImagePassTests'):
              assert any(name in t.get('className','') for t in methods),name
          evidence=Path(os.environ['VINTAGERTX_DIRECT_EVIDENCE'])
          meta=json.loads((evidence/'direct-image.json').read_text())
          assert meta['width']==40 and meta['height']==24
          assert (evidence/'direct-hdr-rgba32f.bin').stat().st_size==40*24*4*4
          assert (evidence/'direct-preview.ppm').is_file()
          print(c.attrib)
          PY
          cmp src/VintageRTX.Client/assets/vintagertx/config/emission.json src/VintageRTX.Client/bin/Release/Mods/vintagertx/assets/vintagertx/config/emission.json
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: always()
        with:
          name: rewrite-adapter-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
