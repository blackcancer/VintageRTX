name: Renderer rewrite foundations
on:
  push:
    branches: ['dev/renderer-rewrite-20260921']
  pull_request:
    branches: ['dev/renderer-rewrite-20260921']
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: New core invariants and reference transport (not in-game acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Test exact tracked core sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          dotnet --info > artifacts/dotnet.txt
          dotnet test tests/VintageRTX.Core.Tests/VintageRTX.Core.Tests.csproj -c Release --logger 'trx;LogFileName=core.trx' --results-directory artifacts 2>&1 | tee artifacts/core.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('artifacts/core.trx').getroot()
          c=r.find('.//{*}Counters'); assert c is not None
          assert int(c.get('total','0')) >= 44, c.attrib
          assert c.get('total')==c.get('executed')==c.get('passed'),c.attrib
          assert len(list(Path('src').rglob('*ModSystem.cs')))==1
          assert not Path('src/VintageRTX').exists(), 'Legacy engine must not be active in this branch'
          print(c.attrib)
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rewrite-core-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  adapter:
    name: Compile observation adapter against official Vintage Story 1.22.7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Obtain official references (never package game binaries)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vs" artifacts
          curl -fL --retry 2 --max-time 180 https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > artifacts/client.sha256
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs"
          dll=$(find "$RUNNER_TEMP/vs" -name VintagestoryAPI.dll -print -quit)
          test -n "$dll"
          echo "VINTAGE_STORY=$(dirname "$dll")" >> "$GITHUB_ENV"
      - name: Compile actual public-API adapter
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/VintageRTX.Client/VintageRTX.Client.csproj -c Release 2>&1 | tee artifacts/adapter.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rewrite-adapter-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
