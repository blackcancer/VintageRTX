name: Installable recovery delivery

on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths:
      - '.github/workflows/recovery-delivery.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'Directory.Build.*'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare official client references and hidden graphics context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery/evidence" "$RUNNER_TEMP/vs-client"
          git rev-parse HEAD > "$RUNNER_TEMP/delivery/evidence/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/delivery/evidence/source-status.txt"
          test ! -s "$RUNNER_TEMP/delivery/evidence/source-status.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1 > "$RUNNER_TEMP/delivery/evidence/packages.log"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/delivery/evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/glsl-tests"
          "$RUNNER_TEMP/glsl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          "$RUNNER_TEMP/glsl-tests/bin/pip" freeze > "$RUNNER_TEMP/delivery/evidence/python-packages.txt"
      - name: Compile mod and real test projects in Release
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info > "$RUNNER_TEMP/delivery/evidence/dotnet.txt"
          for project in tests/VintageRTX.Test/VintageRTX.Test.csproj tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj; do
            dotnet restore "$project" --source https://api.nuget.org/v3/index.json
            dotnet build "$project" -c Release --no-restore
          done 2>&1 | tee "$RUNNER_TEMP/delivery/evidence/build.log"
      - name: Execute reported classes and actual raw-albedo target
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/reported-regressions.runsettings --logger 'trx;LogFileName=reported.trx' --results-directory "$RUNNER_TEMP/delivery/evidence" > "$RUNNER_TEMP/delivery/evidence/reported.log" 2>&1
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~RawAlbedoTargetTests' --logger 'trx;LogFileName=raw-albedo.trx' --results-directory "$RUNNER_TEMP/delivery/evidence" > "$RUNNER_TEMP/delivery/evidence/raw-albedo.log" 2>&1
      - name: Execute production GLSL and unchanged synthetic RenderLab
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          for suite in recovery feedback materials transport; do
            "$RUNNER_TEMP/glsl-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/delivery/evidence/glsl-$suite.log"
          done
          timeout 180s xvfb-run -a dotnet test tools/VintageRTX.RenderLab/VintageRTX.RenderLab.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProductionShaderCompilesAndRendersHeadlessly' --logger 'trx;LogFileName=renderlab.trx' --results-directory "$RUNNER_TEMP/delivery/evidence" > "$RUNNER_TEMP/delivery/evidence/renderlab.log" 2>&1
      - name: Verify payload and create installable ZIP plus exact sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, zipfile
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          delivery = Path(os.environ['RUNNER_TEMP']) / 'delivery'
          evidence = delivery / 'evidence'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout does not match the workflow source.')
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise SystemExit('Tracked/untracked source changes during qualification.')
          reports = {}
          for name, minimum in [('reported', 103), ('raw-albedo', 1), ('renderlab', 1)]:
              tree = ET.parse(evidence / (name + '.trx'))
              results = [n for n in tree.iter() if n.tag.endswith('UnitTestResult')]
              if len(results) < minimum or any(n.get('outcome') != 'Passed' for n in results):
                  raise SystemExit(f'{name}: required tests missing, failed, inconclusive or skipped.')
              reports[name] = len(results)
          python_reports = {}
          for suite, minimum in [('recovery', 4), ('feedback', 4), ('materials', 9), ('transport', 5)]:
              log = (evidence / ('glsl-' + suite + '.log')).read_text()
              count = re.search(r'^Ran (\d+) tests? in ', log, re.M)
              if not count or int(count[1]) < minimum or not re.search(r'^OK\s*$', log, re.M):
                  raise SystemExit(f'{suite}: missing successful numerical GLSL report.')
              if re.search(r'skipped|expected failures|unexpected successes', log, re.I):
                  raise SystemExit(f'{suite}: incomplete GLSL campaign.')
              python_reports[suite] = int(count[1])

          source = root / 'src/VintageRTX'
          output = source / 'bin/Release/Mods/vintagertx'
          metadata = json.loads((output / 'modinfo.json').read_text())
          if metadata['modid'] != 'vintagertx' or metadata['dependencies']['game'] != '1.22.7':
              raise SystemExit('Unexpected mod identity or target client.')
          dll = output / 'VintageRTX.dll'
          if dll.read_bytes()[:2] != b'MZ':
              raise SystemExit('Compiled mod DLL is missing or invalid.')
          # Allowlist only the mod and its tracked runtime assets. Never distribute the client,
          # native libraries, runtime-test support, authentication or user-world artifacts.
          files = {'VintageRTX.dll': dll, 'modinfo.json': output / 'modinfo.json'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z', 'src/VintageRTX/assets']).decode().split('\0')
          for name in filter(None, tracked):
              original = root / name
              relative = original.relative_to(source).as_posix()
              copied = output / relative
              if not copied.is_file() or copied.read_bytes() != original.read_bytes():
                  raise SystemExit('Missing or stale deployed asset: ' + relative)
              files[relative] = copied
          for optional in ['VintageRTX.pdb']:
              if (output / optional).is_file():
                  files[optional] = output / optional
          if len(files) < 20 or not any(name.endswith('/display.frag') for name in files):
              raise SystemExit('Incomplete runtime payload.')
          if any(Path(name).suffix.lower() in {'.ttf', '.otf', '.woff', '.woff2', '.ttc'} for name in files):
              raise SystemExit('Font files require a separate distribution review.')
          digest = lambda data: hashlib.sha256(data).hexdigest()
          manifest = {
              'sourceCommit': commit,
              'branch': 'dev/renderer-recovery-20260918',
              'gameVersion': '1.22.7',
              'modVersion': metadata['version'],
              'configuration': 'Release',
              'sdk': '10.0.401',
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'validation': {'mstestCampaigns': reports, 'glslCampaigns': python_reports,
                  'environment': 'Ubuntu 24.04, official Linux client references, Mesa llvmpipe, EGL/Xvfb',
                  'inGameValidated': False,
                  'note': 'Counts are separate campaigns, not a claim of total unique repository coverage.'},
              'knownOpenIssues': [
                  'Dynamic-source indirect transport at adaptive Performance tier remains incomplete.',
                  'Most contribution diagnostics still pass through the native final composite.',
                  'Reported cave-interior GPU/FPS acceptance is not resolved or remeasured.',
                  'Animated occluders, rough multidirectional reflections and motion reprojection remain incomplete.'
              ],
              'sha256': {name: digest(path.read_bytes()) for name, path in sorted(files.items())}
          }
          manifest_bytes = (json.dumps(manifest, indent=2, ensure_ascii=False) + '\n').encode()
          (delivery / 'BUILD-MANIFEST.json').write_bytes(manifest_bytes)
          readme = f'''VintageRTX — build de reprise installable\n\nCommit : {commit}\nClient cible : Vintage Story 1.22.7\nConfiguration : Release ; version déclarée : {metadata['version']}\n\nCette archive contient le mod compilé, ses shaders et ses assets. Ce n'est pas un dossier de diagnostic.\nFermer le jeu ; conserver l'ancienne version hors du dossier Mods ; placer ce ZIP sans l'extraire dans le dossier Mods.\nNe pas garder une autre copie de VintageRTX dans un chemin de mods actif.\nLes sources sont livrées séparément ; le module de test runtime n'est pas inclus dans le ZIP du mod.\n\nPortée : intégration des correctifs déjà présents dans la branche, dont la résolution du hook Harmony\nqui empêchait la capture d'albedo RGB. Aucun nouveau correctif de transport n'est introduit par le packaging.\nLes tests automatisés sont détaillés dans BUILD-MANIFEST.json. Leur succès n'est pas une validation en jeu.\nLe rebond dynamique au niveau Performance, les diagnostics de contribution post-final et les budgets\nGPU/FPS signalés pour cave-interior restent ouverts. Cette archive n'est pas une version finale intégralement corrigée.\n'''
          short = commit[:8]
          mod_zip = delivery / f'VintageRTX-1.22.7-recovery-{short}-mod.zip'
          with zipfile.ZipFile(mod_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for name, path in sorted(files.items()):
                  archive.write(path, name)
              archive.writestr('BUILD-MANIFEST.json', manifest_bytes)
              archive.writestr('LIRE-MOI-INSTALLATION.txt', readme)
          with zipfile.ZipFile(mod_zip) as archive:
              if archive.testzip() is not None or len(archive.namelist()) != len(set(archive.namelist())):
                  raise SystemExit('Invalid or ambiguous installable ZIP.')
              if 'modinfo.json' not in archive.namelist() or 'VintageRTX.dll' not in archive.namelist():
                  raise SystemExit('Mod payload must live at ZIP root.')

          source_zip = delivery / f'VintageRTX-1.22.7-recovery-{short}-sources.zip'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=VintageRTX-' + short + '/',
              '-o', str(source_zip), commit], check=True)
          with zipfile.ZipFile(source_zip) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Source archive verification failed.')
              if any(Path(n).suffix.lower() in {'.ttf', '.otf', '.woff', '.woff2', '.ttc'} for n in archive.namelist()):
                  raise SystemExit('Source font files require separate review.')
          (delivery / 'SHA256SUMS.txt').write_text(''.join(
              digest(path.read_bytes()) + '  ' + path.name + '\n' for path in [mod_zip, source_zip]))
          print(json.dumps({'sourceCommit': commit, 'mstest': reports, 'glsl': python_reports,
              'modFiles': len(files), 'archives': [p.name for p in [mod_zip, source_zip]]}, indent=2))
          PY
      - name: Upload tested installable mod and matching sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VintageRTX-installable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/delivery/*-mod.zip
            ${{ runner.temp }}/delivery/*-sources.zip
            ${{ runner.temp }}/delivery/BUILD-MANIFEST.json
            ${{ runner.temp }}/delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload text qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VintageRTX-delivery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/evidence/
          if-no-files-found: error
          retention-days: 30
