name: Validate and publish material transport
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/recovery/*material*', 'tests/materials/**', 'tests/VintageRTX.Test/RawAlbedoTargetTests.cs', 'src/VintageRTX/Rendering/RawAlbedo*.cs', '.github/workflows/publish-material-transport.yml']
permissions:
  contents: write
concurrency:
  group: material-transport-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Materialize exact material changes
        run: |
          mkdir -p "$RUNNER_TEMP/material-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/material-evidence/staging-commit.txt"
          python3 tools/recovery/implement_material_transport.py
          git diff --check
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Install actual game references and software GL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1 > "$RUNNER_TEMP/material-evidence/mesa-install.log"
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/material-evidence/client-package.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile the mod and real test project
        run: |
          set -euo pipefail
          dotnet restore tests/VintageRTX.Test/VintageRTX.Test.csproj --source https://api.nuget.org/v3/index.json
          dotnet build tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/material-evidence/build.log"
      - name: Execute production GLSL numerical tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gl-tests"
          "$RUNNER_TEMP/gl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          for suite in recovery feedback materials; do
            "$RUNNER_TEMP/gl-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/material-evidence/$suite.log"
          done
      - name: Execute real optional MRT and existing blocker smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          code=0
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RawAlbedoTargetTests --logger 'trx;LogFileName=raw-albedo.trx' --results-directory "$RUNNER_TEMP/material-evidence" > "$RUNNER_TEMP/material-evidence/raw-albedo.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/material-evidence/raw-albedo.log"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/blocker-smoke.runsettings --logger 'trx;LogFileName=blocker-smoke.trx' --results-directory "$RUNNER_TEMP/material-evidence" > "$RUNNER_TEMP/material-evidence/blocker-smoke.log" 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then tail -100 "$RUNNER_TEMP/material-evidence/blocker-smoke.log"; exit "$code"; fi
          python3 tools/recovery/check_blocker_smoke.py "$RUNNER_TEMP/material-evidence/blocker-smoke.trx"
      - name: Publish ordinary tested source files only
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/Rendering/ReflectionSourceCaptureRenderer.cs src/VintageRTX/Rendering/FilmicDisplayRenderer.cs src/VintageRTX/Rendering/RawAlbedoCapture.cs src/VintageRTX/assets/game/shaders/chunkopaque.fsh src/VintageRTX/assets/game/shaders/entityanimated.fsh src/VintageRTX/assets/vintagertx/shaders/display.frag tests/VintageRTX.Test/PreflightSuite.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rendering): capture unlit RGB and evaluate material-aware GGX without metal gain stacks'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/material-evidence/published-commit.txt"
      - name: Archive test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-transport-${{ github.sha }}
          path: ${{ runner.temp }}/material-evidence/
          if-no-files-found: error
          retention-days: 14
