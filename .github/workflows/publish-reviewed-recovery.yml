name: Publish reviewed recovery sources
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/recovery/publish-request.json', '.github/workflows/publish-reviewed-recovery.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-recovery-source-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Materialize exactly reviewed source changes
        run: python3 tools/recovery/publish_recovery_sources.py
      - name: Install isolated GLSL test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev
          python3 -m venv "$RUNNER_TEMP/ray-tests"
          "$RUNNER_TEMP/ray-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
      - name: Execute production GLSL against independent ray-box oracles
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          "$RUNNER_TEMP/ray-tests/bin/python" -m unittest discover -s tests/recovery -v
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Compile only the mod against the official client references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl --fail --location --retry 2 --max-time 180 \
            'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' \
            -o "$RUNNER_TEMP/vs-client.tar.gz"
          sha256sum "$RUNNER_TEMP/vs-client.tar.gz"
          tar -xzf "$RUNNER_TEMP/vs-client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          export VINTAGE_STORY="$(dirname "$api_dll")"
          dotnet build src/VintageRTX/VintageRTX.csproj -c Release
          # References remain temporary; no game DLL, asset or font is published.
      - name: Commit ordinary source files to the development branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VintageRTX/Rendering/EntityMirrorProjection.cs \
            src/VintageRTX/Rendering/FilmicDisplayRenderer.cs \
            src/VintageRTX/assets/vintagertx/shaders/display.frag \
            src/VintageRTX/Configuration/ConfigStore.cs \
            src/VintageRTX/Configuration/VintageRtxConfig.cs \
            src/VintageRTX/VintageRtxModSystem.cs \
            src/VintageRTX/assets/vintagertx/lang/en.json \
            src/VintageRTX/assets/vintagertx/lang/fr.json
          git diff --cached --stat
          git commit -m 'fix(rendering): pair mirror depth, return exact voxel hits and expose native settings'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD
