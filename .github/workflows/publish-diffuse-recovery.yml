name: Verify and publish diffuse recovery
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/recovery/diffuse-staging/**', '.github/workflows/publish-diffuse-recovery.yml']
permissions:
  contents: write
concurrency:
  group: diffuse-recovery-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify input identities and apply the explicit source diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diffuse-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/diffuse-evidence/staging-commit.txt"
          python3 - <<'PY'
          import hashlib,pathlib,re,os
          expected={
           'src/VintageRTX/Rendering/FilmicDisplayRenderer.cs':'6db1fc6422c5e3e682410ac5f2f6c564cc8e69ec',
           'src/VintageRTX/assets/vintagertx/shaders/display.frag':'f6a8502d68357a1f2f291d301119e3161a82c904',
           'tests/VintageRTX.Test/ScenarioCatalog.cs':'68bfd38c0dd81cfe249993cc7c8bd6a2cf0f79ec',
           'tests/VintageRTX.Test/RuntimeLogValidator.cs':'5507438e76b2c073659b407088f62c7a3ddaf271',
           'tests/VintageRTX.Test/ShadowFilterPipelineTests.cs':'988a84924007d0ab0080ddd84ff560d5fa2cd00c',
           'tests/VintageRTX.Test/CoverageFilmicResidualTests.cs':'75b515c37fa8f9984d523bc2178e7fb5f46eae8d',
           'tests/VintageRTX.Test/PreflightSuite.cs':'5a039e19d370528a8503020b798848d24a2bf1d1'}
          for path,sha in expected.items():
              b=pathlib.Path(path).read_bytes()
              if hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()!=sha:raise SystemExit('Unexpected base '+path)
          patch=pathlib.Path('tools/recovery/diffuse-staging/change.patch').read_text()
          patch=re.sub(r'^--- a/(.+)\n\+\+\+ b/(.+)$',lambda m:f'diff --git a/{m[1]} b/{m[2]}\n'+m[0],patch,flags=re.M)
          i=patch.index('@@ -961,7 +961,7 @@')
          patch=patch[:i]+'''@@ -961,7 +961,7 @@
                           && !renderer.Contains("voxelBounceDiagnosticCapture", StringComparison.Ordinal)
                           && renderer.Contains("effectiveReflectionSteps = adaptiveQualityLevel switch", StringComparison.Ordinal)
                           && renderer.Contains("effectiveVoxelReflectionSteps = adaptiveQualityLevel switch", StringComparison.Ordinal)
          -                && renderer.Contains("effectiveVoxelBounceRayCount = adaptiveQualityLevel switch", StringComparison.Ordinal),
          +                && renderer.Contains("DiffuseTransportBudget.RayCount(", StringComparison.Ordinal),
                       "native diagnostics must use exactly the runtime profile's reflection and bounce budgets");
                   Assert(
                       renderer.Contains("VintageRtxRenderProfile.Extreme => 16", StringComparison.Ordinal)
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'],'diffuse.patch').write_text(patch)
          PY
          git apply --recount --check "$RUNNER_TEMP/diffuse.patch"
          git apply --recount "$RUNNER_TEMP/diffuse.patch"
          git apply --check tools/recovery/diffuse-staging/capture-epoch.patch
          git apply tools/recovery/diffuse-staging/capture-epoch.patch
          git apply --check tools/recovery/diffuse-staging/finalization.patch
          git apply tools/recovery/diffuse-staging/finalization.patch
          test ! -e src/VintageRTX/Rendering/DiffuseTransportBudget.cs
          test ! -e tests/VintageRTX.Test/RuntimeTransportRecoveryTests.cs
          cp tools/recovery/diffuse-staging/DiffuseTransportBudget.cs.txt src/VintageRTX/Rendering/DiffuseTransportBudget.cs
          cp tools/recovery/diffuse-staging/RuntimeTransportRecoveryTests.cs.txt tests/VintageRTX.Test/RuntimeTransportRecoveryTests.cs
          cp tools/recovery/diffuse-staging/test_reduced_transport.py.txt tests/transport/test_reduced_transport.py
          git diff --check
          git diff > "$RUNNER_TEMP/diffuse-evidence/reviewed-source.patch"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare actual client references and graphics context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/diffuse-evidence/client.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile actual mod and test project
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/VintageRTX.Test/VintageRTX.Test.csproj --source https://api.nuget.org/v3/index.json
          dotnet build tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/diffuse-evidence/build.log"
      - name: Execute complete regression and modified pipeline classes
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/reported-regressions.runsettings --logger 'trx;LogFileName=reported.trx' --results-directory "$RUNNER_TEMP/diffuse-evidence" 2>&1 | tee "$RUNNER_TEMP/diffuse-evidence/reported.log"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~RuntimeTransportRecoveryTests|FullyQualifiedName~ShadowFilterPipelineTests|FullyQualifiedName~RuntimeVegetationMapScenarioTests|FullyQualifiedName~RuntimeCoverageProbeTickTests' --logger 'trx;LogFileName=transport.trx' --results-directory "$RUNNER_TEMP/diffuse-evidence" 2>&1 | tee "$RUNNER_TEMP/diffuse-evidence/transport.log"
      - name: Execute real GLSL raw-filter-resolve and existing numerical oracles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/graphics-tests"
          "$RUNNER_TEMP/graphics-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          for suite in recovery feedback materials transport; do
            "$RUNNER_TEMP/graphics-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/diffuse-evidence/glsl-$suite.log"
          done
      - name: Publish verified ordinary sources without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,xml.etree.ElementTree as E
          for name in ['reported.trx','transport.trx']:
              root=E.parse(pathlib.Path(os.environ['RUNNER_TEMP'],'diffuse-evidence',name)).getroot()
              results=root.findall('.//{*}UnitTestResult')
              if not results or any(r.get('outcome')!='Passed' for r in results):raise SystemExit('Incomplete or non-passing '+name)
              print(name,len(results),'passed')
          PY
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/Rendering/FilmicDisplayRenderer.cs src/VintageRTX/Rendering/DiffuseTransportBudget.cs src/VintageRTX/assets/vintagertx/shaders/display.frag tests/VintageRTX.Test/ScenarioCatalog.cs tests/VintageRTX.Test/RuntimeLogValidator.cs tests/VintageRTX.Test/ShadowFilterPipelineTests.cs tests/VintageRTX.Test/CoverageFilmicResidualTests.cs tests/VintageRTX.Test/PreflightSuite.cs tests/VintageRTX.Test/RuntimeTransportRecoveryTests.cs tests/transport/test_reduced_transport.py
          git rm -r tools/recovery/diffuse-staging .github/workflows/publish-diffuse-recovery.yml .github/workflows/recovery-native-shadow-probe.yml
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): preserve dynamic diffuse transport in a current-frame reduced MRT'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/diffuse-evidence/published-commit.txt"
          git ls-tree -r HEAD src/VintageRTX > "$RUNNER_TEMP/diffuse-evidence/published-source-tree.txt"
      - name: Preserve text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diffuse-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/diffuse-evidence/
          retention-days: 14
          if-no-files-found: error
