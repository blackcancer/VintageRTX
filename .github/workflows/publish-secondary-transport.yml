name: Validate and publish secondary transport
on:
  push:
    branches: [dev/renderer-recovery-20260918]
    paths: ['tools/recovery/apply_secondary_transport.py', 'tests/transport/**', '.github/workflows/publish-secondary-transport.yml']
permissions:
  contents: write
concurrency:
  group: secondary-transport-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'blackcancer/VintageRTX' && github.ref == 'refs/heads/dev/renderer-recovery-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify base and apply the secondary transport change
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transport-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/transport-evidence/staging-commit.txt"
          test "$(git hash-object src/VintageRTX/assets/vintagertx/shaders/display.frag)" = 7176cd73c9415da71898ad4294df5da2749b941a
          python3 tools/recovery/apply_secondary_transport.py
          git diff --check
          git diff --stat > "$RUNNER_TEMP/transport-evidence/change-stat.txt"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Prepare Vintage Story references and Mesa
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri libgl-dev libglfw3 xvfb libxinerama1 libxcursor1 > "$RUNNER_TEMP/transport-evidence/mesa-install.log"
          mkdir -p "$RUNNER_TEMP/vs-client"
          curl -fsSL --retry 2 --max-time 180 'https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.7.tar.gz' -o "$RUNNER_TEMP/client.tar.gz"
          sha256sum "$RUNNER_TEMP/client.tar.gz" > "$RUNNER_TEMP/transport-evidence/client-package.sha256"
          tar -xzf "$RUNNER_TEMP/client.tar.gz" -C "$RUNNER_TEMP/vs-client"
          api_dll=$(find "$RUNNER_TEMP/vs-client" -name VintagestoryAPI.dll -print -quit)
          test -n "$api_dll"
          echo "VINTAGE_STORY=$(dirname "$api_dll")" >> "$GITHUB_ENV"
      - name: Compile the mod and test assembly
        run: |
          set -euo pipefail
          dotnet restore tests/VintageRTX.Test/VintageRTX.Test.csproj --source https://api.nuget.org/v3/index.json
          dotnet build tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/transport-evidence/build.log"
      - name: Execute production GLSL and independent numerical fixtures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gl-tests"
          "$RUNNER_TEMP/gl-tests/bin/pip" install 'numpy>=2,<3' 'moderngl>=5.12,<6'
          for suite in recovery feedback materials transport; do
            "$RUNNER_TEMP/gl-tests/bin/python" -m unittest discover -s "tests/$suite" -v 2>&1 | tee "$RUNNER_TEMP/transport-evidence/$suite.log"
          done
      - name: Execute embedded witness, startup, projection and real MRT checks
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$VINTAGE_STORY/Lib:${LD_LIBRARY_PATH:-}"
          code=0
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --settings tests/blocker-smoke.runsettings --logger 'trx;LogFileName=blocker-smoke.trx' --results-directory "$RUNNER_TEMP/transport-evidence" > "$RUNNER_TEMP/transport-evidence/blocker-smoke.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/transport-evidence/blocker-smoke.log"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          python3 tools/recovery/check_blocker_smoke.py "$RUNNER_TEMP/transport-evidence/blocker-smoke.trx"
          xvfb-run -a dotnet test tests/VintageRTX.Test/VintageRTX.Test.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RawAlbedoTargetTests --logger 'trx;LogFileName=raw-albedo.trx' --results-directory "$RUNNER_TEMP/transport-evidence" > "$RUNNER_TEMP/transport-evidence/raw-albedo.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/transport-evidence/raw-albedo.log"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Publish ordinary tested shader without overwriting concurrent commits
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/dev/renderer-recovery-20260918 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git add src/VintageRTX/assets/vintagertx/shaders/display.frag
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): preserve secondary-light visibility, source ownership and geometric precision'
          git push origin HEAD:refs/heads/dev/renderer-recovery-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/transport-evidence/published-commit.txt"
      - name: Archive test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secondary-transport-${{ github.sha }}
          path: ${{ runner.temp }}/transport-evidence/
          if-no-files-found: error
          retention-days: 14
